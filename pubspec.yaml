name: aud_dsp_sampler
description: "SFZ sampler node of the Audanika Audio Engine on the sfizz fork"
version: 0.3.1
publish_to: none
homepage: https://github.com/audaudio/aud_dsp_sampler
repository: https://github.com/audaudio/aud_dsp_sampler

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.2.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.5.1
  code_assets: ^2.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.5
  record_use: ^1.1.1

dev_dependencies:
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.5.1
  aud_midi_standard: ^0.1.0
  dna_audanika: ^0.0.2
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  helix: ^1.12.0
  test: ^1.33.0

# Builds the Java shim in android/ into Android apps: a content provider
# that hands the AssetManager of the app to the native library when the
# process starts, so that "apk:/" paths read the assets of the APK (ticket
# 27). The plugin class registers no channel; it only exists so that Flutter
# compiles the shim. The package has no Flutter dependency.
flutter:
  plugin:
    platforms:
      android:
        package: com.audanika.aud_dsp_sampler
        pluginClass: AudDspSamplerPlugin
