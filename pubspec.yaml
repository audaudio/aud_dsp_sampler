name: aud_dsp_sampler
description: "SFZ sampler node of the Audanika Audio Engine on the sfizz fork"
version: 0.0.1
publish_to: none
homepage: https://github.com/audaudio/aud_dsp_sampler
repository: https://github.com/audaudio/aud_dsp_sampler

environment:
  sdk: ^3.12.2

dependencies:
  aud_audio_core:
    git:
      url: https://github.com/audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.0.1
  code_assets: ^1.1.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  dna_audanika: ^0.0.2
  ffi: ^2.1.4
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  helix: ^1.11.0
  test: ^1.28.0
